services:
  mysql:
    image: mysql:8.0
    container_name: job-matcher-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: job_matcher
      MYSQL_USER: jobmatcher
      MYSQL_PASSWORD: jobmatcher_pass
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "jobmatcher", "-pjobmatcher_pass"]
      interval: 5s
      timeout: 5s
      retries: 15

volumes:
  mysql_data:
