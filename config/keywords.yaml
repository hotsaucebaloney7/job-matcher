        - rest api
        - microservices
        - sqlalchemy

  tier_3:
    name: "Tier 3: Credentials & DevOps Bonuses"
    points_per_group: 5
    max_points: 10
    groups:
      Graduate Degree:
        - "master's"
        - "ms in"
        - "m.s."
        - phd
        - "ph.d."
        - graduate degree
      Containers & CI/CD:
        - docker
        - kubernetes
        - git
        - ci/cd
        - github actions
        - linux
      Experimentation:
        - a/b testing
        - causal inference
        - hypothesis testing
        - time series
        - bayesian

  # Track 1 Federal / Defense / Law-Enforcement Analytics "Unfair Advantage" Boosts
  # Applied as additive point multipliers when federal/clearance/investigative signals are present.
  federal_tier_1_boost:
    name: "Federal Tier 1 Boost: Clearance, DoD & Financial Crime"
    points_per_group: 22
